services:
  - type: web
    name: mythos-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-vercel-domain.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: mythos-db
          property: connectionString

databases:
  - name: mythos-db
    databaseName: mythos
    user: mythos
